<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Note • Multitasking</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: 35px;
    }

    button {
        font-family: inherit;
        border: 0;
        outline: none;
    }

    /* =========================
       APP
    ========================= */

    .app {
        width: 100%;
        min-height: 100vh;
        background: #000;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 16px;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 12px;
        animation: slideDown .45s ease;
    }

    .top-button {
        width: 44px;
        height: 44px;
        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #fff;
        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 50%;

        cursor: pointer;

        transition:
            transform .2s ease,
            background .2s ease;
    }

    .top-button:active {
        transform: scale(.86);
        background: rgba(255,255,255,.09);
    }

    .top-title {
        flex: 1;
        min-width: 0;

        font-size: 15px;
        font-weight: 600;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* =========================
       NOTE
    ========================= */

    .note {
        margin-top: 12px;
        padding: 22px;

        border-radius: 28px;

        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.075);

        animation: fadeUp .5s ease;

        overflow: hidden;
    }

    .note-title {
        margin: 0;

        font-size: 26px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -.6px;

        word-break: break-word;
    }

    .note-meta {
        display: flex;
        align-items: center;
        gap: 8px;

        margin-top: 10px;

        color: rgba(255,255,255,.32);
        font-size: 11px;
    }

    .dot {
        width: 3px;
        height: 3px;

        border-radius: 50%;
        background: rgba(255,255,255,.28);
    }

    .note-content {
        margin-top: 24px;

        color: rgba(255,255,255,.72);

        font-size: 15px;
        line-height: 1.75;

        white-space: pre-wrap;
        word-break: break-word;
    }

    /* =========================
       ATTACHMENTS
    ========================= */

    .attachments {
        margin-top: 25px;

        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    .attachments-title {
        margin: 0 0 4px;

        color: rgba(255,255,255,.42);
        font-size: 12px;
        font-weight: 600;
    }

    .attachment {
        display: flex;
        align-items: center;
        gap: 12px;

        width: 100%;
        min-height: 58px;
        padding: 10px 13px;

        border-radius: 18px;

        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.065);
    }

    .attachment-icon {
        width: 38px;
        height: 38px;

        flex-shrink: 0;

        border-radius: 13px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(255,255,255,.055);
    }

    .attachment-info {
        min-width: 0;
        flex: 1;
    }

    .attachment-name {
        margin: 0;

        color: rgba(255,255,255,.75);

        font-size: 13px;
        font-weight: 500;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .attachment-type {
        margin: 4px 0 0;

        color: rgba(255,255,255,.28);
        font-size: 10px;
    }

    /* =========================
       BOTTOM ACTIONS
    ========================= */

    .actions {
        display: flex;
        gap: 10px;

        margin-top: 18px;
    }

    .action-button {
        flex: 1;

        min-height: 50px;
        padding: 0 16px;

        border-radius: 25px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        color: rgba(255,255,255,.72);

        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.075);

        cursor: pointer;

        transition:
            transform .2s ease,
            background .2s ease;
    }

    .action-button:active {
        transform: scale(.95);
        background: rgba(255,255,255,.08);
    }

    .delete-button {
        flex: 0 0 52px;
        padding: 0;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
        display: none;

        min-height: 70vh;

        align-items: center;
        justify-content: center;
        flex-direction: column;

        text-align: center;

        animation: fadeUp .4s ease;
    }

    .error-icon {
        width: 64px;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 22px;

        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.075);

        margin-bottom: 17px;
    }

    .error-title {
        margin: 0 0 7px;
        font-size: 17px;
    }

    .error-text {
        margin: 0;

        max-width: 270px;

        color: rgba(255,255,255,.35);
        font-size: 13px;
        line-height: 1.5;
    }

    /* =========================
       RIPPLE
    ========================= */

    .ripple {
        position: fixed;

        width: 10px;
        height: 10px;

        border-radius: 50%;

        background: rgba(255,255,255,.12);

        pointer-events: none;

        transform:
            translate(-50%, -50%)
            scale(0);

        animation: ripple .5s ease-out forwards;

        z-index: 9999;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes slideDown {

        from {
            opacity: 0;
            transform: translateY(-12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    @keyframes fadeUp {

        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    @keyframes ripple {

        to {
            opacity: 0;
            transform:
                translate(-50%, -50%)
                scale(20);
        }

    }
</style>

</head><body><div class="app"><div class="container">

    <!-- TOP BAR -->

    <header class="topbar">

        <button
            class="top-button"
            id="backButton"
            aria-label="Back">

            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M19 12H5"/>
                <path d="m12 19-7-7 7-7"/>

            </svg>

        </button>


        <div
            class="top-title"
            id="topTitle">
            Note
        </div>


        <button
            class="top-button"
            id="editButton"
            aria-label="Edit">

            <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>

            </svg>

        </button>

    </header>


    <!-- NOTE CONTENT -->

    <article
        class="note"
        id="noteView"
        style="display:none;">

        <h1
            class="note-title"
            id="noteTitle">
        </h1>


        <div class="note-meta">

            <span id="noteDate">
                —
            </span>

            <span class="dot"></span>

            <span id="noteUpdated">
                Updated
            </span>

        </div>


        <div
            class="note-content"
            id="noteContent">
        </div>


        <!-- ATTACHMENTS -->

        <section
            class="attachments"
            id="attachmentsSection"
            style="display:none;">

            <h2 class="attachments-title">
                Attachments
            </h2>

            <div id="attachmentsList"></div>

        </section>

    </article>


    <!-- ACTIONS -->

    <div
        class="actions"
        id="actions"
        style="display:none;">

        <button
            class="action-button"
            id="editBottomButton">

            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>

            </svg>

            Edit

        </button>


        <button
            class="action-button delete-button"
            id="deleteButton"
            aria-label="Delete note">

            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M3 6h18"/>
                <path d="M8 6V4h8v2"/>
                <path d="M19 6l-1 15H6L5 6"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>

            </svg>

        </button>

    </div>


    <!-- ERROR -->

    <section
        class="error"
        id="errorState">

        <div class="error-icon">

            <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round">

                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v5"/>
                <path d="M12 16h.01"/>

            </svg>

        </div>

        <h2 class="error-title">
            Note not found
        </h2>

        <p class="error-text">
            This note may have been deleted or the link is invalid.
        </p>

    </section>

</div>

</div><script>

    /*
     * Multitasking
     * Note Viewer
     */


    const noteView =
        document.getElementById("noteView");

    const errorState =
        document.getElementById("errorState");

    const actions =
        document.getElementById("actions");

    const noteTitle =
        document.getElementById("noteTitle");

    const noteContent =
        document.getElementById("noteContent");

    const noteDate =
        document.getElementById("noteDate");

    const noteUpdated =
        document.getElementById("noteUpdated");

    const topTitle =
        document.getElementById("topTitle");

    const attachmentsSection =
        document.getElementById("attachmentsSection");

    const attachmentsList =
        document.getElementById("attachmentsList");


    /*
     * Get note ID from URL.
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const noteId =
        params.get("id");


    /*
     * Escape HTML.
     */

    function escapeHTML(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * Format date.
     */

    function formatDate(value) {

        const date =
            new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Unknown date";
        }

        return date.toLocaleDateString(
            undefined,
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    /*
     * Load notes.
     */

    function getNotes() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "multitasking_notes"
                ) || "[]"
            );

        } catch {

            return [];

        }

    }


    /*
     * Find note.
     */

    function getCurrentNote() {

        if (!noteId) {
            return null;
        }

        const notes =
            getNotes();

        return notes.find(
            note =>
                String(note.id) ===
                String(noteId)
        ) || null;

    }


    /*
     * Render attachments.
     */

    function renderAttachments(note) {

        const attachments =
            Array.isArray(note.attachments)
                ? note.attachments
                : [];


        if (!attachments.length) {

            attachmentsSection.style.display =
                "none";

            return;

        }


        attachmentsSection.style.display =
            "flex";

        attachmentsList.innerHTML = "";


        attachments.forEach(file => {

            const item =
                document.createElement("div");

            item.className =
                "attachment";


            item.innerHTML = `

                <div class="attachment-icon">

                    <svg
                        width="19"
                        height="19"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M14 2v6h6"/>

                    </svg>

                </div>

                <div class="attachment-info">

                    <p class="attachment-name">
                        ${escapeHTML(file.name || "Attachment")}
                    </p>

                    <p class="attachment-type">
                        ${escapeHTML(file.type || "File")}
                    </p>

                </div>

            `;


            attachmentsList.appendChild(item);

        });

    }


    /*
     * Render note.
     */

    function renderNote() {

        const note =
            getCurrentNote();


        if (!note) {

            noteView.style.display =
                "none";

            actions.style.display =
                "none";

            errorState.style.display =
                "flex";

            return;

        }


        errorState.style.display =
            "none";

        noteView.style.display =
            "block";

        actions.style.display =
            "flex";


        const title =
            note.title?.trim() ||
            "Untitled note";


        topTitle.textContent =
            title;

        noteTitle.textContent =
            title;

        noteContent.textContent =
            note.content || "";

        noteDate.textContent =
            formatDate(
                note.createdAt
            );

        noteUpdated.textContent =
            "Updated " +
            formatDate(
                note.updatedAt ||
                note.createdAt
            );


        renderAttachments(note);

    }


    /*
     * Navigation.
     */

    function openEditor() {

        if (!noteId) {
            return;
        }

        location.href =
            "edit.html?id=" +
            encodeURIComponent(noteId);

    }


    function goBack() {

        if (document.referrer) {

            history.back();

        } else {

            location.href =
                "index.html";

        }

    }


    /*
     * Delete note.
     */

    function deleteNote() {

        const note =
            getCurrentNote();

        if (!note) {
            return;
        }


        /*
         * Simple confirmation.
         */

        const confirmed =
            window.confirm(
                "Delete this note?"
            );


        if (!confirmed) {
            return;
        }


        let notes =
            getNotes();


        notes =
            notes.filter(
                item =>
                    String(item.id) !==
                    String(noteId)
            );


        localStorage.setItem(
            "multitasking_notes",
            JSON.stringify(notes)
        );


        location.href =
            "index.html";

    }


    /*
     * Ripple effect.
     */

    function ripple(event) {

        if (!event) {
            return;
        }


        const element =
            document.createElement("span");

        element.className =
            "ripple";

        element.style.left =
            event.clientX + "px";

        element.style.top =
            event.clientY + "px";


        document.body.appendChild(
            element
        );


        setTimeout(() => {
            element.remove();
        }, 550);

    }


    /*
     * Buttons.
     */

    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            event => {

                ripple(event);
                goBack();

            }
        );


    document
        .getElementById("editButton")
        .addEventListener(
            "click",
            event => {

                ripple(event);
                openEditor();

            }
        );


    document
        .getElementById("editBottomButton")
        .addEventListener(
            "click",
            event => {

                ripple(event);
                openEditor();

            }
        );


    document
        .getElementById("deleteButton")
        .addEventListener(
            "click",
            event => {

                ripple(event);
                deleteNote();

            }
        );


    /*
     * Initial render.
     */

    renderNote();


    /*
     * Refresh when returning.
     */

    window.addEventListener(
        "pageshow",
        renderNote
    );

</script></body>
</html>
